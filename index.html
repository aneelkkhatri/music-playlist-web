<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090b">
  <title>Playlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <nav class="topbar">
    <a class="back" href="list.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Library
    </a>
  </nav>

  <main class="page">
    <header class="hero">
      <div class="cover" id="hero-cover"></div>
      <div class="hero-text">
        <span class="eyebrow">Playlist</span>
        <h1 class="hero-title" id="playlist-title">Loading…</h1>
        <p class="hero-meta" id="playlist-meta"></p>
      </div>
    </header>

    <div class="toolbar">
      <label class="search primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="title-filter-bar" placeholder="Search songs, artists, albums" aria-label="Search songs, artists and albums" autocomplete="off">
      </label>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <input type="search" id="channel-filter-bar" placeholder="Channel" aria-label="Filter by channel" autocomplete="off">
      </label>
    </div>

    <div class="list-head" aria-hidden="true">
      <span class="idx-h">#</span>
      <span class="title-h">Title <span class="count" id="track-count"></span></span>
      <span class="album-h">Album</span>
      <span class="dur-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span></span>
    </div>
    <div id="playlist"></div>
    <p class="state" id="state" hidden></p>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
